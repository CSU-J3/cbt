# HO 488 — secretless CI. Catches the class of failure that shipped at 3ed533c
# (broken `npm run typecheck` undetected until the next session). No DB creds:
# `next build` was verified to prerender cleanly without TURSO_* / GEMINI_API_KEY
# (every DB-backed route is dynamic), so no `env:` block and no secrets here.
name: CI

on:
  # Skip docs-only commits — they can't meaningfully fail typecheck+build.
  # paths-ignore (a blocklist), NOT paths (an allowlist): a blocklist fails
  # safe. An allowlist would silently skip CI the first time someone adds a
  # path that isn't on it. scripts/** and e2e/** are deliberately NOT ignored
  # (both are TypeScript and both are covered by `npm run typecheck`: scripts/**
  # by tsconfig.json, which is exactly what broke at 3ed533c, and e2e/** plus
  # playwright.config.ts by tsconfig.e2e.json, chained into the same script since
  # HO 709 — before that the harness was in no program at all, which is how a
  # `reducedMotion` in the wrong options bag sat unread for two HOs, HO 708);
  # .github/** stays unignored so workflow edits still run CI.
  #
  # paths-ignore + required status checks do not mix: if branch protection
  # is ever enabled, PRs touching only ignored paths never report this
  # check and block indefinitely. Fix then is a companion job that reports
  # success for ignored paths — not removing the filter.
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
      - 'LICENSE'

# A rapid re-push cancels the in-flight run for the same ref instead of queuing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # No `engines` pin in package.json; 20 LTS per HO 488 fallback.
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # HO 693 — the STATIC half of the odds gate. Before `build` because it is
      # a second's worth of file reads and its failure is a merge-blocking
      # authoring mistake, not a build problem: a new prediction-market render
      # site must be gated (`odds-only` + `data-market`) and listed in
      # e2e/odds-sites.allowlist.json. Deterministic — no browser, no network,
      # no DB — so it is safe on the secretless PR path.
      #
      # It is the pre-merge half only. The DYNAMIC half (e2e/odds-off.spec.ts,
      # asserting no visible [data-market] with the preference set) rides the
      # prod crawl in e2e-prod.yml, deliberately off the PR path.
      - name: Odds-site allowlist
        run: npm run check:odds-sites

      - name: Build
        run: npm run build
