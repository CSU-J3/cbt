# HO 504 — unattended prod e2e. Separate from ci.yml on purpose: this never runs
# on the PR path, so it can't become a required check that fails to report under
# the paths-ignore / branch-protection landmine ci.yml documents. Two failure
# classes, two triggers: deployment_status catches "this deploy broke prod";
# schedule catches "prod is broken now" (cron / data rot) even with no new deploy.
# Vercel emits GitHub deployment_status(state=success, env=Production) to this
# repo (HO 504 Step-0, verified live), so post-deploy coverage is real.
name: e2e-prod

on:
  deployment_status:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      force_overflow_red:
        description: 'Force a synthetic overflow finding (proves the alarm reaches a human)'
        type: boolean
        default: false

# HO 683 — needed by the overflow-alarm issue step. Declaring ANY permissions
# block drops every other scope to none, so `contents: read` is spelled out
# rather than relied on: the checkout would break silently otherwise, and this
# workflow's whole job is not to fail silently.
permissions:
  contents: read
  issues: write

# CONCURRENCY. The group key is built from the SAME discriminators the job `if`
# below reads, and that mirroring is the design, not a coincidence: every skipped
# class collides only with itself, so no run that does no work can share a group
# with one doing the work. Change the key and the `if` together, or neither.
#
# Original purpose, preserved byte-for-byte WITHIN a group: a burst of deploys
# (Vercel fired 5 in one minute for the last push train) all point at the same
# eventual prod, so keep only the latest smoke and cancel the rest. Production
# successes still carry identical key inputs, so they still collapse.
#
# HO 685 — WHY THE KEY AND NOT THE `cancel-in-progress` FLAG. Concurrency is
# evaluated BEFORE the job `if`. Under the old global `e2e-prod` group that meant
# ANY deployment_status event — including a Preview deploy from an ordinary
# review-ref push, whose job the `if` then SKIPS — cancelled an in-flight crawl.
# A run that did no work at all cancelled the run doing the work. Twice on the
# record, both 2026-09-02:
#   * 33667308181 — the ARMED daily (0 15 * * *, GitHub-delivered 18:27), killed
#     2m46s in by 33667584259, a Preview run whose job then skipped. The overflow
#     alarm arms only on schedule/workflow_dispatch, so a cancelled armed run
#     files nothing and is indistinguishable from a quiet prod. That is the
#     alarm's blind window, realized on its actual carrier.
#   * 33673317612 — a dispatch, cancelled 89s into its ~3-minute crawl by
#     33673395814, a run created 47s after it: also a skipped Preview event.
#     Re-dispatched clean as 33673524519.
#
# THE SAFETY PROPERTY IS TOTAL, not incidental. A group is working iff
# event != deployment_status OR (environment == Production AND state == success).
# The key contains exactly those three discriminators, so a working run and a
# skipped run can never share a group for any value Vercel might emit, including
# states never yet observed. Measured at HO 685 STEP 0, `state` is a constant
# `success` across the 62-status corpus (Preview 36 / Production 26) and does no
# discriminating today — it is in the key for that totality, not for a live
# distinction. Per-event-only was weighed and rejected: it closes the alarm's
# window but still lets a skipped Preview run cancel a working Production crawl
# inside a shared deploy group — same mechanism, narrower victim.
#
# schedule and workflow_dispatch carry no deployment_status object, so both
# resolve to constant singleton groups: e2e-prod-schedule-na-na and
# e2e-prod-workflow_dispatch-na-na.
#
# Transition residual, bounded and harmless: a deployment_status run checks out
# the DEPLOYMENT's own ref, so deploys of commits predating this change execute
# the old yaml under the bare `e2e-prod` group. Group matching is exact-string,
# so those runs can only cancel each other and can never reach a new-key group.
# Ends as live branches rebase past this commit.
concurrency:
  group: e2e-prod-${{ github.event_name }}-${{ github.event.deployment_status.environment || 'na' }}-${{ github.event.deployment_status.state || 'na' }}
  cancel-in-progress: true

jobs:
  smoke:
    # deployment_status fires for every state/environment; gate to successful
    # Production only. schedule / workflow_dispatch carry no deployment_status
    # object, so they fall through the OR and always run.
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    # Unattended run against a live target: cap it so a hung crawl can't burn the
    # GitHub default of 360 min before anyone notices. A full crawl is ~1-2 min.
    timeout-minutes: 20
    steps:
      # HO 685 — prints the group this run actually resolved to.
      #
      # SCOPE, stated because it is easy to over-read. A step cannot read
      # `concurrency.group`: the value is not exposed to the job, and the runs API
      # carries no concurrency field either (both checked at HO 685 STEP 0, which
      # is why the handoff's "read the group off the run" instrument does not
      # exist). So this echo necessarily SHARES its expression with the key above.
      # It therefore verifies EXPRESSION SEMANTICS — what the three discriminators
      # and the `|| 'na'` fallbacks resolve to per event class — and CANNOT catch a
      # typo in the key itself, whose content is verified by reading the yaml.
      # It also cannot report a skip-only group, because the job that would print
      # it is the job being skipped; those groups' distinctness is carried
      # behaviorally instead, by the collision test (a dispatch that SURVIVES a
      # mid-crawl Preview event is proof the two are in different groups).
      - name: Show resolved concurrency group
        run: echo "concurrency group = e2e-prod-${{ github.event_name }}-${{ github.event.deployment_status.environment || 'na' }}-${{ github.event.deployment_status.state || 'na' }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match ci.yml — node 20, npm cache. v5 action bump is its own loop.
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run prod smoke crawl
        # smoke.spec.ts ONLY (explicit path, never an e2e/ glob that would silently
        # pick up the next spec that lands). Runs against the live prod domain
        # (spec BASE_URL default). --grep-invert "@nonci" drops the tagged
        # markets-hover case: bucket D — prod withholds the tape from headless
        # Chrome under BotID, so there's nothing to hover. (That also records why
        # the backlog's hardening #1, "freeze the marquee so the hover lands," is
        # moot-under-BotID, not done.) retries=2 via CLI flag, not config: an
        # unattended run needs cold-start tolerance, but the committed
        # playwright.config.ts stays honest at retries:0 for the manual default.
        #
        # The ~2 min of checkout + npm ci + browser install ABOVE is not dead cost:
        # it's the delay that makes the deployment_status trigger safe against the
        # alias-swap race. By the time the crawl fires, Vercel has finished pointing
        # the prod domain at the deploy whose success event woke us. Anyone who
        # caches that install to speed the job up must re-verify the crawl still
        # starts AFTER the alias swap, not before.
        #
        # HO 683 — the overflow alarm is ARMED HERE, and only on the two
        # human/clock triggers. A `deployment_status` run leaves SMOKE_OVERFLOW_GATE
        # empty and the spec does no reads, so a red deploy keeps meaning "your
        # change broke it". The class is DATA-armed (HO 682: a long committee
        # title arriving overnight blew `/` open with no commit behind it), and a
        # defect nobody caused must not block somebody else's deploy — it files an
        # issue instead. Both branches print a gate line in the log.
        env:
          SMOKE_OVERFLOW_GATE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
          SMOKE_OVERFLOW_FORCE: ${{ inputs.force_overflow_red && '1' || '' }}
        run: npx playwright test e2e/smoke.spec.ts --grep-invert "@nonci" --retries=2

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # HO 683 — the overflow rows ride the artifact too. If issue creation
          # itself ever fails (a permissions regression, a gh outage), this is the
          # surviving record that an alarm TRIED to fire; without it that failure
          # mode is silent, which is the defect this whole HO exists to remove.
          path: |
            playwright-report/
            test-results/smoke-overflow-*.md
          retention-days: 14

      # HO 687 — the #418 attribution dumps (served bytes + settled DOM + stack +
      # SSR/DOM alignment), one set per captured fire.
      #
      # KEYED ON FILE PRESENCE, NOT `failure()`, and the ledger is why: a run with
      # `--retries=2` concludes `success` when a retry passes, so a fire-carrying
      # run frequently is not a failed run. The 2026-08-29 daily concluded
      # `success` carrying SEVEN fire-lines; under `if: failure()` every one of
      # those dumps would have been discarded. Same rule, same reason, as the
      # overflow step below.
      #
      # Its own artifact name rather than a path added to the failure upload
      # above: two steps writing one artifact name collide, and these must
      # survive independently of whether the run went red.
      # NOTE the quoting: an unquoted `#` after a space starts a YAML comment, so
      # `name: Upload #418 …` parses to the step name "Upload" and silently drops
      # the rest. Valid YAML, working workflow, meaningless label.
      - name: "Upload #418 attribution dumps"
        if: always() && hashFiles('test-results/pageerr-*.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pageerr-dumps
          path: test-results/pageerr-*
          retention-days: 14

      # HO 683 — the alarm's human end. Corey runs the GitHub app on his phone, so
      # the issue IS the ping.
      #
      # KEYED ON FILE PRESENCE, NEVER ON `failure()`. The crawl's other failure
      # class — the intermittent `pageErr` on backlog `:50` — reds this workflow
      # without writing any overflow row, so a bare `failure()` would file overflow
      # issues for hydration noise and the two classes would become one. File
      # presence is what keeps them separate. `always()` so a run that reds for
      # BOTH reasons still pings for the overflow half.
      - name: File overflow alarm
        if: always() && hashFiles('test-results/smoke-overflow-*.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='[smoke-overflow] prod horizontal overflow'
          {
            echo "The prod smoke crawl found the document scrolling horizontally at the crawl's 1280 viewport."
            echo
            echo "| route | scrollWidth | clientWidth | over |"
            echo "|---|---|---|---|"
            cat test-results/smoke-overflow-*.md
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo "Trigger: ${{ github.event_name }}. This alarm is armed on schedule/dispatch only — it never blocks a deploy."
            echo "A FORCED-RED row means someone dispatched the proof leg; prod is fine."
          } > /tmp/overflow-body.md
          # Dedupe on the title marker rather than a label, so nothing has to
          # pre-exist in the repo for the alarm to work on its first fire.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/overflow-body.md
            echo "commented on existing issue #${EXISTING}"
          else
            gh issue create --title "$TITLE" --body-file /tmp/overflow-body.md
          fi
